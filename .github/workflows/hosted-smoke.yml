name: Hosted launch smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read

jobs:
  hosted-smoke:
    if: ${{ vars.RADAR_BASE_URL != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      RADAR_BASE_URL: ${{ vars.RADAR_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:hosted
