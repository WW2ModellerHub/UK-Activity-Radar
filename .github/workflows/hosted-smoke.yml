name: Hosted launch smoke

on:
  workflow_dispatch:
  schedule:
    - cron: "17,47 * * * *"

permissions:
  contents: read

jobs:
  hosted-smoke:
    if: ${{ vars.RADAR_BASE_URL != '' }}
    # Pinned with CI's browser job: Playwright 1.55.1 cannot install
    # Chromium on the Ubuntu 26.04 image behind ubuntu-latest.
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      RADAR_BASE_URL: ${{ vars.RADAR_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:hosted
