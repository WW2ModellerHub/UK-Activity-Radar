name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q app
      - run: python -m pytest -q tests test_release_wiring.py

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run check:js
      # GitHub-hosted runners already include Chromium's shared-library
      # dependencies. Avoid apt here: the Azure Ubuntu mirror can suffer DNS
      # outages which otherwise block an application release for ten minutes.
      - run: npx playwright install chromium
      - run: npm run test:e2e
